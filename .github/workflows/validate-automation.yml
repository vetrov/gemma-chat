name: Validate automation

on:
  pull_request:
    paths:
      - ".github/**"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "AGENTS.md"
  workflow_dispatch:

concurrency:
  group: validate-automation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON configuration
        run: |
          jq --exit-status '.' .github/opencode/opencode.json >/dev/null
          jq --exit-status '
            .share == "disabled" and
            .autoupdate == false and
            .snapshot == false and
            .permission.external_directory == "deny" and
            .permission.webfetch == "deny" and
            .permission.websearch == "deny"
          ' .github/opencode/opencode.json >/dev/null

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint"'

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 \
            --output "$archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" zizmor

      - name: Audit GitHub Actions security
        run: '"$RUNNER_TEMP/zizmor" .github/workflows'
