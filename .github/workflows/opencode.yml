name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENCODE_VERSION: 1.18.31
      OPENCODE_SHA256: e9312be75ed803b7415fc2aeabda1f4fe938912a39673762dc0c38c0e11ebde4
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --local user.name "opencode-agent[bot]"
          git config --local user.email "219766164+opencode-agent[bot]@users.noreply.github.com"

      - name: Cache OpenCode release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opencode/opencode.tar.gz
          key: opencode-linux-x64-${{ env.OPENCODE_VERSION }}-${{ env.OPENCODE_SHA256 }}

      - name: Prepare OpenCode
        run: |
          archive="$HOME/.cache/opencode/opencode.tar.gz"
          mkdir -p "$(dirname "$archive")" "$RUNNER_TEMP/opencode"
          if [[ ! -f "$archive" ]]; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --retry 3 \
              --output "$archive" \
              "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          fi
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/opencode" opencode
          chmod 755 "$RUNNER_TEMP/opencode/opencode"

      - name: Run OpenCode
        env:
          MODEL: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode/opencode.json
          SHARE: "false"
        run: '"$RUNNER_TEMP/opencode/opencode" github run'

      - name: Report disk usage
        if: always()
        run: |
          echo "--- Disk free ---"
          df -h /
          echo "--- Workspace usage ---"
          du -sh "${{ github.workspace }}"
